<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логін Сторінка</title>
    <style>
        /* ===== Скидання ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== Загальний стиль ===== */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #eef2f7;
            color: #111827;
            padding: 0px;
        }


        /* ===== Меню ===== */

        /* ===== Блок логіну ===== */
        .container h2 {
            text-align: center;
            font-size: 42px;
            margin-top: 90px;
            margin-bottom: 35px;
            color: #0f172a;
            font-weight: 800;
        }

        /* ===== Форма ===== */
        form {
            max-width: 470px;
            margin: 0 auto 100px;
            background: white;
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.08);
        }

        /* ===== Label ===== */
        label {
            display: block;
            margin-bottom: 10px;
            margin-top: 18px;
            font-size: 15px;
            font-weight: 700;
            color: #334155;
        }

        /* ===== Inputs ===== */
        input {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: 0.25s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.10);
        }

        /* ===== Кнопка ===== */
        button {
            width: 100%;
            margin-top: 28px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(34,197,94,0.25);
        }

        /* ===== Адаптив ===== */
        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                gap: 18px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 18px;
            }

            .container h2 {
                font-size: 34px;
                margin-top: 55px;
            }

            form {
                padding: 30px 25px;
            }
        }

        header {
            background-color: #111827;
            color: white;
            padding: 20px;
        }
        footer {
            background: #111827;
            color: #cbd5e1;
            padding: 28px 0;
            margin-top: 24px;
            position: sticky;
            top: 100vh; /* Позиционирует футер внизу */
        }
        .footer-links {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .footer-links a {
            color: #93c5fd;
            text-decoration: none;
        }
        .nav-links a:hover {
            background-color: rgba(255,255,255,0.2);
        }
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-weight: 700;
            font-size: 22px;
            color: white;
        }
        .menu {
            display: flex;
            gap: 18px;
        }
        .menu a {
            color: #d1d5db;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .menu a:hover {
            color: #ffffff;
        }
        .menu a.active {
            color: #ffffff;
        }
        .hero {
            padding: 10px 0;
            background: linear-gradient(120deg, #0f172a, #1d4ed8);
            color: #ffffff;
            text-align: center;
        }
        .hero h2 {
            font-size: 44px;
            margin-bottom: 14px;
            color: white;

        }
        .hero p {
            max-width: 750px;
            font-size: 18px;
            color: #e5e7eb;
            margin-bottom: 24px;
        }
        .hero-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #22c55e;
            color: #04210e;
        }
        .btn-primary:hover {
            background: #16a34a;
        }
        .btn-secondary {
            color: #ffffff;
            border-color: #93c5fd;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0px 20px;

        }
        .container-flex{
            display: flex;
        }
        .card{
            margin: 20px;
            padding: 20px 20px;
        }
        footer {
            position: sticky;
            top: 100vh; /* Позиционирует футер внизу */
        }

        </style>
    <link rel="stylesheet" href="/generalStyle.css">
</head>
<body>
<header>
    <div class="container nav">
        <div class="logo">IT Kids School</div>
        <nav class="menu">
            <a class="active" href="/openSource/homepage">Головна</a>
            <a href="/openSource/courses">Курси</a>
        </nav>
    </div>
</header>

<section class="hero">
    <h2>Увійти</h2>
</section>
<div class="error-box" th:if="${output == 'notValid'}">Не коректні данні</div>
<div class="container" style="margin-top: 30px">

    <form action="/login" method="post">
        <label for="username">Логін:</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Увійти</button>
    </form>
</div>
</body>
</html>
