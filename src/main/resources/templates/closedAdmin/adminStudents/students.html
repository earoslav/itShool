<!DOCTYPE html>
<!-- Коротко: Thymeleaf-шаблон сторінки. -->
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Kids School - Учні</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/generalStyle.css">
</head>
<body>
<header th:replace="~{fragments/header :: adminHeader}"></header>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<section class="hero">
    <div class="container">
        <h3 >Учні:</h3>
    </div>
</section>

<!-- FORM -->
<div class="container">
    <div class="card">
        <form method="get" class="list-limit-form">
            <label for="listLimit">Показати:</label>
            <select id="listLimit" name="limit">
                <option value="10" th:selected="${listLimit == '10'}">10</option>
                <option value="100" th:selected="${listLimit == '100'}">100</option>
                <option value="all" th:selected="${listLimit == 'all'}">Усі</option>
            </select>
            <button type="submit" class="btn btn-blue">Застосувати</button>
        </form>
        <input type="text" id="myInput" onkeyup="searchStudent()" placeholder="Пошук за ім'ям..">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Ім'я</th>
                <th>Вік</th>
                <th>Email</th>
                <th>Телефон</th>
                <th>Коментар</th>
                <th>Дії</th>
            </tr>
            </thead>

            <tbody id="students">
            <tr th:each="student : ${students}">
                <td th:text="${student.id}">1</td>
                <td th:text="${student.user.name}">Ім'я</td>
                <td th:text="${student.age}">15</td>
                <td th:text="${student.user.email}">email</td>
                <td th:text="${student.phoneNumber}">+380...</td>
                <td th:text="${student.comment}">comment</td>

                <td>
                    <a th:href="@{/admin/student/{id}/edit(id=${student.id})}" class="btn btn-blue">✏️</a>
                    <a th:href="@{/admin/student/{id}/lessons(id=${student.id})}" class="btn btn-blue">📋 Уроки</a>
                    <form method="post" th:action="@{/admin/student/delete}">
<!--                    <a th:href="@{/admin/student/delete/{id}(id=${student.id})}"-->
<!--                       class="btn btn-red"-->
<!--                       onclick="return confirm('Видалити?')">🗑</a>-->
                        <input type="hidden" name="studentId" th:value="${student.id}" />
                    <button class="btn btn-red" type="submit" onclick="return confirm('Видалити?')">🗑</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- якщо список пустий -->
        <div th:if="${students.isEmpty()}">
            <p>Учнів поки немає</p>
        </div>

    </div>
</div>

<footer th:replace="~{fragments/footer :: standardFooter}"></footer>
