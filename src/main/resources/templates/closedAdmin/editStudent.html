<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: #111827;
            color: #ffffff;
            padding: 16px 0;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

        }

        .logo {
            font-weight: 700;
            font-size: 22px;
        }

        .menu {
            display: flex;
            gap: 18px;
        }

        .menu a {
            color: #d1d5db;
            text-decoration: none;
            font-weight: 600;
        }

        .menu a:hover {
            color: #ffffff;
        }

        .hero {
            padding: 56px 0;
            background: linear-gradient(120deg, #0f172a, #1d4ed8);
            color: #ffffff;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 8px;
            margin-left: 30px;
        }

        .hero p {
            margin-left: 30px;
            color: #e5e7eb;
        }

        main {
            padding: 48px 0;
        }

        .form-card {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
        }

        input,
        textarea {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:invalid:focus,
        textarea:invalid:focus {
            border-color: #dc2626;
            outline: none;
        }

        .error-box {
            border: 1px solid #fecaca;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .hint {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .submit-btn {
            margin-top: 14px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        footer {
            background: #111827;
            color: #cbd5e1;
            padding: 28px 0;
            margin-top: 24px;
        }

        .footer-links {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .footer-links a {
            color: #93c5fd;
            text-decoration: none;
        }

        .courses-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .course-check {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
        }

        .times-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        .times-table th,
        .times-table td {
            border: 1px solid #e2e8f0;
            padding: 8px 6px;
            text-align: center;
            vertical-align: middle;
            font-size: 13px;
        }

        .times-table th:first-child {
            width: 110px;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: linear-gradient(90deg, #0f172a, #1e3a8a);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            color: white;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            background: linear-gradient(90deg, #1e3a8a, #2563eb);
            color: white;
            padding: 50px 40px;
        }

        .main-content {
            flex: 1;
        }

        .container {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #1e3a8a;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-green {
            background-color: #22c55e;
            color: white;
        }

        .btn-blue {
            background-color: #3b82f6;
            color: white;
            margin-left: 10px;
        }

        footer {
            background: #0f172a;
            color: white;
            padding: 20px 40px;
        }
        .schedule-wrapper {
            margin-top: 30px;
        }

        .schedule-scroll {
            overflow-x: auto;
        }

        .schedule-table {
            border-collapse: collapse;
            min-width: 1200px;
        }

        .schedule-table th, .schedule-table td {
            border: 1px solid #ddd;
            /*padding: 8px;*/
            text-align: center;
            min-width: 100px;
        }

        .schedule-table th {
            background: #1e3a8a;
            color: white;
        }

        .cell-red {
            background-color: #ef4444;
            color: white;
        }
        .cell-green {
            background-color: #3ed347;
            color: black;
        }

        .schedule-table td:hover {
            background-color: #dbeafe;
            cursor: pointer;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .menu {
            display: flex;
            gap: 18px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }
    </style>
</head>
<body>
<header>
    <div class="container navbar">
        <div class="logo">IT Kids School</div>
        <nav class="menu">
            <a href="/admin/homepage">Головна</a>
            <a href="/admin/students">Учні</a>
            <a href="/admin/teachers">Викладачі</a>
        </nav>
    </div>
</header>
<div class="hero">
    <h1>Редагування учня</h1>
</div>

<!-- MAIN -->
<div class="main-content">
    <div class="container">
        <div class="card">
            <div class="error-box" th:if="${error == 'exists'}">Така пошта вже зареєстрована</div>
            <div class="error-box" th:if="${error == 'general'}">Упс, щось пішло не так</div>
            <form th:action="@{/admin/student/edit/{id}(id=${student.id})}" th:object="${student}" method="post">

                <!-- ID -->
                <input type="hidden" th:field="*{id}"/>

                <div class="form-group">
                    <label>Ім'я</label>
                    <input type="text" th:field="*{name}"  required minlength="2" maxlength="100"
                            title="Лише букви, пробіли, апостроф або дефіс">
                </div>

                <div class="form-group">
                    <label>Вік</label>
                    <input type="number" th:field="*{age}" min="7" max="17">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" maxlength="50">
                </div>

                <div class="form-group">
                    <label>Телефон</label>
                    <input type="text" th:field="*{phoneNumber}" maxlength="15"
                           pattern="^[0-9+\\-()\\s]{10,15}$" >
                </div>

                <div class="form-group">
                    <label>Пароль</label>
                    <input type="text" th:field="*{password}" minlength="6" maxlength="50">
                </div>

                <div class="form-group">
                    <label>Коментар</label>
                    <textarea th:field="*{comment}" maxlength="500"
                              placeholder="Наприклад: зручний час занять, рівень підготовки, побажання"></textarea>
                </div>


                <button type="submit" class="btn btn-green">
                    Зберегти
                </button>

                <a   th:href="@{/admin/students}" class="btn btn-blue">
                    Назад
                </a>

            </form>



        </div>
    </div>
</div>
<footer>
    <div class="container">
        <div>IT Kids School - розвиток майбутніх IT-талантів.</div>
        <div style="margin-top: 10px;">
            Контакти: 0970959664 | yaroslav.gorbatyuk.2004@gmail.com | Telegram: Uarrik
        </div>
        <div class="footer-links">
            <a href="#">Instagram</a>
            <a href="#">Telegram</a>
            <a href="#">Facebook</a>
            <a href="#">Політика конфіденційності</a>
        </div>
    </div>
</footer>

</body>

</html>
