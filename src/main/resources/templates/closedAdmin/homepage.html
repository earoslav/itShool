<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
        }

        /* 🔝 Navbar */
        .navbar {
            background: linear-gradient(90deg, #0f172a, #1e3a8a);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .navbar h2 {
            margin: 0;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 14px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background-color: rgba(255,255,255,0.2);
        }

        /* 🔵 Hero */
        .hero {
            background: linear-gradient(90deg, #1e3a8a, #2563eb);
            color: white;
            padding: 60px 40px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
        }

        /* 📦 Card */
        .container {
            padding: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-top: 0;
        }

        .info {
            margin: 10px 0;
            font-size: 16px;
        }

        .label {
            font-weight: bold;
            color: #1e3a8a;
        }

        /* 📊 Buttons */
        .buttons {
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin-right: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-green {
            background-color: #22c55e;
            color: white;
        }

        .btn-green:hover {
            background-color: #16a34a;
        }

        .btn-blue {
            background-color: #3b82f6;
            color: white;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

        }
        .menu {
            display: flex;
            gap: 18px;
        }
        .btn-blue:hover {
            background-color: #2563eb;
        }

    </style>
</head>
<body>

<!-- 🔝 NAVBAR -->
<div class="navbar">
    <h2>Admin Panel</h2>
    <div class="container navbar">
        <div class="logo">IT Kids School</div>
        <nav class="menu">
            <a href="/admin/homepage">Головна</a>
            <a href="/admin/students">Учні</a>
            <a href="/admin/teachers">Викладачі</a>
        </nav>
    </div>
</div>

<!-- 🔵 HERO -->
<div class="hero">
    <h1>Панель адміністратора</h1>
    <p>Керуйте учнями, викладачами та переглядайте інформацію про систему.</p>
</div>

<!-- 📦 ADMIN INFO -->
<div class="container">
    <div class="card">
        <h2>Інформація про адміністратора</h2>

        <div class="info">
            <span class="label">ID:</span>
            <span th:text="${admin.id}">1</span>
        </div>

        <div class="info">
            <span class="label">Ім'я:</span>
            <span th:text="${admin.name}">Admin Name</span>
        </div>

        <div class="info">
            <span class="label">Email:</span>
            <span th:text="${admin.email}">admin@email.com</span>
        </div>

        <div class="info">
            <span class="label">Пароль:</span>
            <span th:text="${admin.password}">******</span>
        </div>

    </div>
    <div class="buttons">
    <a th:href="@{/admin/addTeacher}" class="btn btn-green">Створити вчителя</a>
    </div>
    <div class="buttons">
        <a th:href="@{/admin/addStudent}" class="btn btn-green">Створити учня</a>
    </div>
    <div class="buttons">
        <a th:href="@{/admin/students}" class="btn btn-green">Учні</a>
    </div>
</div>

</body>
</html>
