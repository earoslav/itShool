<!DOCTYPE html>
<!-- Коротко: Thymeleaf-шаблон сторінки. -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Kids School - Головна</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="stylesheet" href="/generalStyle.css">
</head>
<body>
<header th:replace="~{fragments/header :: studentHeader}"></header>

<section class="hero">
    <div class="container">
        <p th:text="'Учень: '+${student.user.name}"></p>

    </div>
</section>

<div class="container">
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <p class="d-none" id="idSt" th:text="${student.id}" style="display: none"></p>
    <div class="card">
        <form  id="form" th:action="@{/student/{idSt}/homepage/(idSt=${student.id})}" th:object="${student}" method="post" onsubmit="return handleSubmit(event)">

            <p class="d-none" id="id" th:text="${student.id}" style="display: none"></p>
            <div class="form-grid">
                <div class="form-group">
                    <label>Ім'я</label>
                    <input type="text" th:field="*{user.name}" required minlength="2" maxlength="50"
                           title="Лише букви, пробіли, апостроф або дефіс">
                </div>

                <div class="form-group">
                    <label>Вік</label>
                    <input type="number" th:field="*{age}" required min="7" max="17">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{user.email}" required maxlength="50">
                </div>

                <div class="form-group">
                    <label>Телефон</label>
                    <input type="text" th:field="*{phoneNumber}" required maxlength="15">
                </div>

                <div class="form-group">
                    <label>Пароль</label>
                    <input type="text" name="password" minlength="6" maxlength="50" id="pass">
                </div>


                <div class="form-group">
                    <label>Коментар</label>
                    <textarea th:field="*{comment}" maxlength="500" required
                              placeholder="Наприклад: зручний час занять, рівень підготовки, побажання"></textarea>
                </div>
            </div>


            <button onclick="managePassStudent()" type="submit" class="btn-small btn btn-green">
                Зберегти
            </button>


        </form>
    </div>
</div>
<footer th:replace="~{fragments/footer :: standardFooter}"></footer>
