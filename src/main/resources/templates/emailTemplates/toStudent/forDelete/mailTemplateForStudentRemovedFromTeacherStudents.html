<!DOCTYPE html>
<!-- Коротко: HTML-шаблон email-повідомлення. -->
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Зміна в вашому графіку</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,0.08);">
                <tr>
                    <td style="background:linear-gradient(120deg,#0f172a,#1d4ed8);padding:20px 24px;color:#ffffff;">
                        <h1 style="margin:0;font-size:22px;">IT Kids School</h1>
                        <p style="margin:8px 0 0;font-size:14px;opacity:0.9;">Лист про припинення занять</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">
                            Скасовано всі ваші подальші заняття з вчителем
                            <strong th:text="${teacher.user.name != null ? teacher.user.name : '—'}">Ім'я</strong>.
                            Якщо бажаєте — зв'яжіться з вчителем та відновіть заняття.
                        </p>
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="8" style="font-size:14px;border-collapse:collapse;">
                            <tr style="border-bottom:1px solid #e2e8f0;">
                                <td style="color:#64748b;">Email</td>
                                <td th:text="${teacher.user.email != null ? teacher.user.email : '—'}">—</td>
                            </tr>
                            <tr style="border-bottom:1px solid #e2e8f0;">
                                <td style="color:#64748b;">Телефон</td>
                                <td th:text="${teacher.phoneNumber != null ? teacher.phoneNumber : '—'}">—</td>
                            </tr>
                            <tr style="border-bottom:1px solid #e2e8f0;">
                                <td style="color:#64748b;">Telegram</td>
                                <td th:text="${teacher.tgUsername != null ? teacher.tgUsername : '—'}">—</td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
